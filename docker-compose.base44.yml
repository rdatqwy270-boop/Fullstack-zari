services:
  server:
    image: node:22
    working_dir: /app/server
    restart: on-failure
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    environment:
      - PORT=4000
      - SHIPPING_FEE=50000
      - FREE_SHIPPING_THRESHOLD=3000000
      - API_URL=http://server:4000
    volumes:
      - ./:/app
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: node:22
    working_dir: /app/zari-luxury-store
    restart: on-failure
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=
      - API_URL=http://server:4000
    ports:
      - "3000:5173"
    volumes:
      - ./:/app
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
